# `cua-driver call <tool>` (how the benchmark agent acts) talks to a running daemon
# over the default unix socket and does not auto-spawn one on this build; keep one up.
# prebuild.sh restarts it after installing the freshly built binary.
[program:cua-driver-serve]
command=/usr/local/bin/cua-driver serve --dangerously-bypass-approvals --no-permissions-gate
environment=HOME="/root",DISPLAY=":1",PATH="/usr/local/cargo/bin:/usr/local/sbin:/usr/local/bin:/usr/sbin:/usr/bin:/sbin:/bin"
autostart=true
autorestart=true
startsecs=2
priority=25
stdout_logfile=/var/log/supervisor/cua-driver-serve.log
redirect_stderr=true

[program:cua-driver-prebuild]
command=/opt/fps-bench/prebuild.sh
environment=HOME="/root",CARGO_HOME="/usr/local/cargo",RUSTUP_HOME="/usr/local/rustup",PATH="/usr/local/cargo/bin:/usr/local/sbin:/usr/local/bin:/usr/sbin:/usr/bin:/sbin:/bin"
autostart=true
autorestart=false
startsecs=0
startretries=0
priority=30
stdout_logfile=/var/log/supervisor/cua-driver-prebuild.log
redirect_stderr=true
